[project]
name = "herd-mentality"
version = "0.1.0"
description = "Simple web server to play the game herd mentality with your friends"
readme = "README.md"
authors = [
    { name = "Lloyd Dakin", email = "taidakin99lol@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
herd-mentality = "herd_mentality.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
