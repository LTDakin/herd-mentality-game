<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- Seamless cow-spot tile. Blobs that cross an edge are repeated on the
       opposite side so the pattern tiles without visible seams. -->
  <g fill="#ff69b4" fill-opacity="0.12">
    <!-- Big lumpy spot, upper left half out of frame. -->
    <path d="M62 8c18-10 40-4 48 12 7 14 3 30-8 40-10 9-26 12-38 6-13-7-19-21-17-34 1-11 6-18 15-24z" />
    <path d="M62 288c18-10 40-4 48 12 7 14 3 30-8 40-10 9-26 12-38 6-13-7-19-21-17-34 1-11 6-18 15-24z" />

    <!-- Wide kidney-shaped spot, right edge, wrapping. -->
    <path d="M232 118c20-4 40 8 42 24 2 15-10 28-26 31-15 2-30-6-33-20-3-15 3-31 17-35z" />
    <path d="M-48 118c20-4 40 8 42 24 2 15-10 28-26 31-15 2-30-6-33-20-3-15 3-31 17-35z" />

    <!-- Long lobed spot, lower left. -->
    <path d="M24 190c10-12 28-14 38-6 8 7 8 18 2 26-7 9-20 12-31 8-12-4-19-16-15-26 1-1 3-2 6-2z" />

    <!-- Small irregular spot, lower right. -->
    <path d="M186 210c12-6 26 0 30 12 3 10-4 20-16 22-13 2-24-6-24-16 0-8 4-15 10-18z" />

    <!-- Teardrop spot, upper middle. -->
    <path d="M140 26c10-2 20 6 20 17 0 12-10 20-21 18-11-1-18-11-17-21 1-9 8-13 18-14z" />

    <!-- Medium spot, bottom center, wrapping across the bottom edge. -->
    <path d="M112 254c14-6 30 2 32 16 2 13-9 24-24 23-14-1-23-12-22-24 1-9 6-12 14-15z" />
    <path d="M112 -26c14-6 30 2 32 16 2 13-9 24-24 23-14-1-23-12-22-24 1-9 6-12 14-15z" />
  </g>
</svg>
